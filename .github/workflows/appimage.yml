name: Build AppImage
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'version number'
        required: false
        type: string
  push:
    tags:
      - 'v*'
    branches: master

  pull_request:
    branches: master
    paths:
      - '.github/workflows/appimage.yml'
      - 'packaging/appimage/**'

jobs:
  build-appimage:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}

    # Built in an Arch container, where the sharun/uruntime tooling and a
    # current ncurses are available. The AppImage bundles its own libc, so the
    # build host does not limit where it runs. Official Arch is x86_64-only,
    # hence the community Arch Linux ARM image (digest-pinned) on the arm leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            image: archlinux:latest
          - runner: ubuntu-24.04-arm
            image: lopsided/archlinux@sha256:bb1e4b4a564126c7d91c63813a3d3afe34334ec5dd15285ed8b574c88e23fbde

    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel git meson ninja ncurses patchelf wget zsync

      - name: Checkout
        uses: actions/checkout@v7

      - name: Set version
        shell: bash
        run: |
          if [[ -z "${VERSION}" ]]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              TAG_NAME=${GITHUB_REF#refs/tags/}
              VERSION=${TAG_NAME#v}
            else
              VERSION=snapshot
            fi
            echo "VERSION=$VERSION" >> $GITHUB_ENV
          fi

      - name: Build AppImage
        run: ./packaging/appimage/make-appimage.sh
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - name: Artifact Filename
        run: echo "ARTIFACT_NAME=NoCarrierMail-appImage-$(uname -m)" >> $GITHUB_ENV

      - if: ${{ github.ref != 'refs/heads/master' }}
        name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./out/*AppImage*
          if-no-files-found: error

      - name: Release (Tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*AppImage*"
          allowUpdates: true
          prerelease: false
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - if: ${{ github.ref == 'refs/heads/master' }}
        name: 'Prerelease'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "./out/*AppImage*"
          body: "NoCarrierMail Snapshot Release"
          allowUpdates: true
          prerelease: true
          removeArtifacts: false
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          tag: snapshot
